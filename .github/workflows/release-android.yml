name: Release Android

# Déclenché à la main (ou via `npm run release -- <version>`), jamais
# automatiquement : un build natif prend ~30 min de runner.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.3.4). Doit exister dans CHANGELOG.md."
        required: true
        type: string
      prerelease:
        description: "Publier en pré-version"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Construire et vérifier sans créer la release (APK en artefact)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est préinstallé sur l'image ubuntu-latest ; inutile de
      # passer par setup-android, qui échoue en voulant installer le paquet
      # obsolète « tools ».
      - name: Vérifier le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -1
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Vérifier que la version correspond à app.json
        if: ${{ !inputs.dry_run }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$APP_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::app.json est en $APP_VERSION mais la publication demande ${{ inputs.version }}."
            echo "::error::Lancez 'npm run release -- ${{ inputs.version }}' qui met à jour app.json avant de déclencher ce workflow."
            exit 1
          fi

      - name: Extraire les notes de version du CHANGELOG
        id: notes
        run: |
          node scripts/changelog.mjs "${{ inputs.version }}" > RELEASE_NOTES.md
          echo "--- notes extraites ---"
          cat RELEASE_NOTES.md

      - run: npm ci

      - name: Contrôle TypeScript
        run: npx tsc --noEmit

      - name: Générer le projet natif
        run: npx expo prebuild --platform android --no-install

      - name: Installer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Construire l'APK signé
        working-directory: android
        run: |
          ./gradlew app:assembleRelease -x lint -x test --no-daemon \
            -PADVENTOOLS_STORE_FILE=release.keystore \
            -PADVENTOOLS_STORE_PASSWORD='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PADVENTOOLS_KEY_ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PADVENTOOLS_KEY_PASSWORD='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Vérifier la signature de l'APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::L'APK est signé avec la clé debug, la clé de release n'a pas été prise en compte."
            exit 1
          fi
          mv "$APK" "adventools_v${{ inputs.version }}.apk"

      - name: Nettoyer la clé
        if: always()
        run: rm -f android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: adventools-v${{ inputs.version }}
          path: adventools_v${{ inputs.version }}.apk
          retention-days: 30

      - name: Publier la release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "V${{ inputs.version }}" \
            "adventools_v${{ inputs.version }}.apk" \
            --title "Adventools_v${{ inputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            ${{ inputs.prerelease && '--prerelease' || '' }}
