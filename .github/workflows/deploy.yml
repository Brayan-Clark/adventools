name: Deploy to GitHub Pages

on:
  push:
    branches: [andeaha-hizaha]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Le build Astro ignore les erreurs de typage : sans cette étape, une
      # régression de type partait en production sans rien signaler.
      - name: Type check
        run: npm run check

      - name: Build
        env:
          # Secrets configurés dans les réglages du repo (Settings → Secrets and variables)
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Facultatif : débloque la lecture des playbacks Google Drive.
          PUBLIC_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
